<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Shopping Cart - eBay</title>

    <link rel="stylesheet" href="ebay.css">

    <style>

        .cart-page {

            max-width: 1200px;

            margin: 50px auto;

            padding: 20px;

        }


        .cart-page h1 {

            margin-bottom: 30px;

        }


        .cart-item {

            display: flex;

            align-items: center;

            gap: 20px;

            padding: 20px 0;

            border-bottom: 1px solid #ddd;

        }


        .cart-item img {

            width: 120px;

            height: 120px;

            object-fit: cover;

            border-radius: 10px;

        }


        .cart-info {

            flex: 1;

        }


        .cart-info h3 {

            margin-bottom: 8px;

        }


        .quantity {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-top: 15px;

        }


        .quantity button {

            width: 30px;

            height: 30px;

            border: 1px solid #ccc;

            background: white;

            border-radius: 50%;

            cursor: pointer;

        }


        .remove {

            border: none;

            background: none;

            color: #0064d2;

            cursor: pointer;

        }


        .cart-total {

            text-align: right;

            margin-top: 30px;

            font-size: 22px;

            font-weight: bold;

        }


        .back-button {

            display: inline-block;

            margin-top: 20px;

            padding: 12px 20px;

            border-radius: 25px;

            background: #191919;

            color: white;

            text-decoration: none;

        }


        @media (max-width: 600px) {

            .cart-item {

                align-items: flex-start;

            }


            .cart-item img {

                width: 90px;

                height: 90px;

            }

        }

    </style>

</head>


<body>


    <div class="cart-page">

        <h1>Your shopping cart</h1>


        <div id="cart-container"></div>


        <div
            id="cart-total"
            class="cart-total"
        ></div>


        <a
            href="index.html"
            class="back-button"
        >
            ← Continue shopping
        </a>

    </div>


    <script>

        let cart =
            JSON.parse(
                localStorage.getItem("ebayCart")
            ) || [];


        const container =
            document.getElementById(
                "cart-container"
            );


        const totalElement =
            document.getElementById(
                "cart-total"
            );


        function saveCart() {

            localStorage.setItem(
                "ebayCart",
                JSON.stringify(cart)
            );

        }


        function displayCart() {

            container.innerHTML = "";

            let total = 0;


            if (cart.length === 0) {

                container.innerHTML =
                    "<p>Your cart is empty.</p>";

                totalElement.textContent =
                    "Total: $0";

                return;

            }


            cart.forEach((item, index) => {

                total +=
                    item.price *
                    item.quantity;


                const itemElement =
                    document.createElement("div");


                itemElement.className =
                    "cart-item";


                itemElement.innerHTML = `

                    <img
                        src="${item.image}"
                        alt="${item.name}"
                    >

                    <div class="cart-info">

                        <h3>
                            ${item.name}
                        </h3>

                        <p>
                            $${item.price}
                        </p>

                        <div class="quantity">

                            <button
                                onclick="decreaseQuantity(${index})"
                            >
                                −
                            </button>

                            <span>
                                ${item.quantity}
                            </span>

                            <button
                                onclick="increaseQuantity(${index})"
                            >
                                +
                            </button>

                        </div>

                        <button
                            class="remove"
                            onclick="removeItem(${index})"
                        >
                            Remove
                        </button>

                    </div>

                `;


                container.appendChild(
                    itemElement
                );

            });


            totalElement.textContent =
                "Total: $" +
                total.toFixed(2);

        }


        function increaseQuantity(index) {

            cart[index].quantity++;

            saveCart();

            displayCart();

        }


        function decreaseQuantity(index) {

            if (
                cart[index].quantity > 1
            ) {

                cart[index].quantity--;

            } else {

                cart.splice(index, 1);

            }


            saveCart();

            displayCart();

        }


        function removeItem(index) {

            cart.splice(index, 1);

            saveCart();

            displayCart();

        }


        displayCart();

    </script>


</body>

</html>
